<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween Countdown</title>
    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>
<body>

<div class="container">
    <img src="img/Pumkin.png" class="logo" alt="PumkinLogo">    

    <div class="content">
        <p>Countdown to Hallows Eve</p>
        <h1>We're Waiting For...</h1>
        <div class="countdown-clock">
            <div>
                <p>00</p>
                <span>Days</span>
            </div>
            <div>
                <p>00</p>
                <span>Hours</span>
            </div>
            <div>
                <p>00</p>
                <span>Minutes</span>
            </div>
            <div>
                <p>00</p>
                <span>Seconds</span>
            </div>
        </div>
        <button type="button">About</button>
    </div>
    <img src="img/Clock.jpg" class="clock">
</div>

</body>
</html>
